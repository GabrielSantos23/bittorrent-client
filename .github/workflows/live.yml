name: Live tests

# The live DHT and tracker tests talk to the real internet; they are
# #[ignore]d in the normal suite and only run on demand.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (ignored live tests)
        run: cargo test --workspace -- --ignored
